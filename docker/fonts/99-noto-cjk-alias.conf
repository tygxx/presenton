<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  桥接 Google/web 字体族名 → 容器里 fonts-noto-cjk 实际安装的族名。
  fonts-noto-cjk 安装的族名是 "Noto Sans CJK SC"，而前端/后端映射用的是 Google Fonts
  名 "Noto Sans SC"（等）。无此别名时 fc-match "Noto Sans SC" 会回退到拉丁字体，
  导致 LibreOffice / headless-chromium 服务端渲染中文豆腐块。
-->
<fontconfig>
  <match target="pattern"><test name="family"><string>Noto Sans SC</string></test><edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK SC</string></edit></match>
  <match target="pattern"><test name="family"><string>Noto Serif SC</string></test><edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK SC</string></edit></match>
  <match target="pattern"><test name="family"><string>Noto Sans TC</string></test><edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK TC</string></edit></match>
  <match target="pattern"><test name="family"><string>Noto Serif TC</string></test><edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK TC</string></edit></match>
  <!-- 常见中文字体名 → 已安装 CJK 字体，作为最后兜底（weak 绑定，不覆盖更精确的映射） -->
  <match target="pattern"><test name="family"><string>Microsoft YaHei</string></test><edit name="family" mode="prepend" binding="weak"><string>Noto Sans CJK SC</string></edit></match>
  <match target="pattern"><test name="family"><string>SimSun</string></test><edit name="family" mode="prepend" binding="weak"><string>Noto Serif CJK SC</string></edit></match>
  <match target="pattern"><test name="family"><string>SimHei</string></test><edit name="family" mode="prepend" binding="weak"><string>Noto Sans CJK SC</string></edit></match>
</fontconfig>
